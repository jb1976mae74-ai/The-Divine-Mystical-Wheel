    <style>
      html, body {
        background-color: #050508;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 30%, #151226 0%, #06050a 100%);
      }
      #root:empty::after {
        content: '';
        width: 48px;
        height: 48px;
        border: 2px solid rgba(212, 175, 55, 0.2);
        border-top-color: #D4AF37;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      const originalError = console.error;
      console.error = function(...args) {
        if (args.some(a => {
          if (typeof a === 'string') return a.includes('Failed to fetch') || a.includes('Scrying error') || a.includes('InvalidKeyMapError') || a.includes('Google Maps');
          if (a && typeof a === 'object') {
            const msg = a.message || String(a);
            return msg.includes('Failed to fetch') || msg.includes('Scrying error') || msg.includes('NetworkError');
          }
          return false;
        })) return;
        originalError.apply(console, args);
      };
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason) {
          const msg = e.reason.message || String(e.reason);
          if (msg.includes('Failed to fetch') || msg.includes('Script error.') || msg.includes('Scrying error')) {
            e.preventDefault();
          }
        }
      });
      window.addEventListener('error', function(e) {
        if (e && (e.message === 'Script error.' || (e.filename && e.filename.includes('maps.googleapis.com')))) {
          e.preventDefault();
          return true;
        }
      });
      window.gm_authFailure = function() {
        console.warn('Google Maps API Authentication Failed (InvalidKeyMapError). Handled gracefully.');
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
